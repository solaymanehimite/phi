# Phi — electron-builder config.
# Tauri is gone: the sidecar is a self-contained Bun binary built to binaries/
# via `bun run build:sidecar`.
appId: com.solaymanehimite.phi
productName: phi
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
  # Main + preload are esbuild-bundled (only `electron` builtin at runtime),
  # the sidecar is a self-contained Bun binary — no node_modules ships.
  - "!node_modules/**"
  - "!src/**"
  - "!server/**"
  - "!electron/**"
  - "!src-tauri/**"
  - "!scripts/**"
  - "!docs/**"
extraResources:
  # Bun-compiled sidecar from `bun run build:sidecar`.
  - from: binaries/
    to: binaries/
    filter:
      - server*
# No branded icons yet: win/mac/linux `icon` keys stay out on purpose so
# packaging uses the default Electron icon (loud) instead of pointing at
# build/icon.* files that do not exist (silent). Add real assets under
# build/ and re-add the keys when they land.
win:
  target:
    - nsis
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
linux:
  category: Development
  target:
    - AppImage
    - dir
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
