<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0d" />
    <link id="phi-favicon" rel="icon" type="image/svg+xml" href="./branding/dark/logo_small.svg" />
    <title>Phi</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("phi:theme");
          if (t !== "light" && t !== "dark" && t !== "system") t = "system";
          document.documentElement.setAttribute("data-theme", t);
          var isLight =
            t === "light" ||
            (t === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) {
            m.setAttribute("content", isLight ? "#ffffff" : "#08080a");
          }
          var icon = document.getElementById("phi-favicon");
          if (icon) {
            icon.setAttribute(
              "href",
              "./branding/" + (isLight ? "light" : "dark") + "/logo_small.svg",
            );
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-BwTnc2zt.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D0ioivR4.css">
  </head>

  </body>
</html>
